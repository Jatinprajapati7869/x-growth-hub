# Copy to %USERPROFILE%\.x-growth-hub\accounts\<id>.yaml (gitignored).
# Hermes profile is the primary runtime — no X API.

id: example_account
hermes_profile: example_account

persona: |
  Voice: technical builder, concise, no engagement bait.
  Topics: dev tools, indie SaaS, AI workflows.

browser:
  chrome_user_data_dir: "%USERPROFILE%\\.x-growth-hub\\chrome-profiles\\example_account"
  emergency_cookie_file: "%USERPROFILE%\\.x-growth-hub\\secrets\\example_account\\cookies.json"

limits:
  posts_per_day: 4
  min_minutes_between_posts: 90

growth:
  allow_follow: false
  allow_like: false
  allow_dm: false
